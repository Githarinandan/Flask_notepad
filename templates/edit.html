{% extends "base.html" %}

{% block content %}
<section class="edit-wrap">
    <a href="{{ url_for('index') }}" class="back-link">Back to all notes</a>
    <div class="panel edit-panel">
        <h1>Edit note</h1>

        <form action="{{ url_for('edit_note', note_id=note.id) }}" method="POST" class="note-form edit-form">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" maxlength="120" value="{{ note.title }}" required>

            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10">{{ note.content or '' }}</textarea>

            <div class="edit-actions">
                <a href="{{ url_for('index') }}" class="button button-secondary">Cancel</a>
                <button class="button button-primary" type="submit">Save changes</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
